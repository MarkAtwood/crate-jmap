[package]
name = "jmap-websocket"
version = "0.6.1"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JMAP over WebSocket (RFC 8887, urn:ietf:params:jmap:websocket): wire frames, capability, and a framework-agnostic server session driver"
keywords = ["jmap", "websocket", "rfc8887", "push"]
categories = ["network-programming", "asynchronous"]
exclude = ["AGENTS.md", "CLAUDE.md", "PLAN.md"]

[features]
# The server session driver (`server` module): text frames in, dispatches
# and Response / RequestError / StateChange frames out, over any
# `Stream` + `Sink` of messages. Off by default so client crates can take
# the frame types without jmap-server and tokio.
server = ["dep:jmap-server", "dep:tokio", "dep:futures", "dep:thiserror"]
# `tungstenite::serve`: run a `server::Connection` over a tokio-tungstenite
# `WebSocketStream`.
tungstenite = ["server", "dep:tokio-tungstenite"]

[dependencies]
jmap-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jmap-server = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync", "macros"] }
tokio-tungstenite = { workspace = true, optional = true }

[dev-dependencies]
jmap-websocket = { path = ".", features = ["server", "tungstenite"] }
# A Dispatcher over a real memory backend for the end-to-end test.
jmap-mail-server = { workspace = true, features = ["memory"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
