[package]
name = "jmap-graph"
version = "0.6.2"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JMAP Graph (draft-atwood-jmap-graph-00): umbrella crate re-exporting jmap-graph-types, -client, and -server"
keywords = ["jmap", "graph"]
categories = ["network-programming"]
exclude = ["AGENTS.md", "CLAUDE.md", "PLAN.md"]

[dependencies]
jmap-graph-types = { workspace = true }
jmap-graph-client = { workspace = true, optional = true }
jmap-graph-server = { workspace = true, optional = true }

[features]
client = ["dep:jmap-graph-client"]
server = ["dep:jmap-graph-server"]
# The server's in-memory reference backend (not production).
memory = ["server", "jmap-graph-server/memory"]

[dev-dependencies]
serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
