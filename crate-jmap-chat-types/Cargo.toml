[package]
name = "jmap-chat-types"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "JMAP Chat extension data types (draft-atwood-jmap-chat-*)"
license = "MIT OR Apache-2.0"
keywords = ["jmap", "chat", "types", "rfc8620"]
categories = ["encoding", "network-programming"]

[dependencies]
jmap-types = { path = "../crate-jmap-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
