[package]
name = "jmap-chat-scene-server"
version = "0.4.0"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Chat binding for the JMAP Scene server (draft-atwood-jmap-scene-wss-00 with draft-atwood-jmap-chat-wss-00): the ChatStreamEnable \"scene\" and SceneStreamEnable subscription union"
keywords = ["jmap", "scene", "chat", "server"]
categories = ["network-programming", "web-programming::http-server"]

[dependencies]
jmap-types = { workspace = true }
jmap-scene-types = { workspace = true }
jmap-scene-server = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
jmap-scene-server = { workspace = true, features = ["memory", "test-helpers"] }
serde_json = { workspace = true }
