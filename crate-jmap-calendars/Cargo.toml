[package]
name = "jmap-calendars"
version = "0.5.0"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JMAP Calendars (draft-ietf-jmap-calendars-34): umbrella crate re-exporting jmap-calendars-types, -client, and -server"
keywords = ["jmap", "calendars", "jscalendar"]
categories = ["network-programming"]
exclude = ["AGENTS.md", "CLAUDE.md", "PLAN.md"]

[dependencies]
jmap-calendars-types = { workspace = true }
jmap-calendars-client = { workspace = true, optional = true }
jmap-calendars-server = { workspace = true, optional = true }

[features]
client = ["dep:jmap-calendars-client"]
server = ["dep:jmap-calendars-server"]
# The server's in-memory reference backend (not production).
memory = ["server", "jmap-calendars-server/memory"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
