[package]
name = "jmap-peer-auth"
version = "0.3.0"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JMAP Chat federation peer authentication: RFC 9421 request signing and verification (draft-atwood-jmap-chat-federation-00), no I/O"
keywords = ["jmap", "federation", "http-signatures", "ed25519"]
categories = ["authentication", "cryptography"]

[dependencies]
base64 = "0.22"
ed25519-dalek = "2.2"
getrandom = { workspace = true, features = ["std"] }
http = { workspace = true }
idna = "1"
jmap-did-types = { workspace = true }
serde_json = { workspace = true }
# 0.14 is the newest sfv whose rust-version (1.77) fits the workspace MSRV.
sfv = "0.14"
sha2 = "0.10"
thiserror = { workspace = true }
url = { workspace = true }
