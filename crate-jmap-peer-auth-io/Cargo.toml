[package]
name = "jmap-peer-auth-io"
version = "0.4.0"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JMAP Chat federation peer-auth I/O: peerSigningKeys fetch and cache, DNSSEC _jmap-peer lookup, replay store (draft-atwood-jmap-chat-federation-00)"
keywords = ["jmap", "federation", "dnssec", "http-signatures"]
categories = ["network-programming", "authentication", "asynchronous"]

[dependencies]
hickory-resolver = { version = "0.26.3", default-features = false, features = ["dnssec-ring", "system-config", "tokio"] }
http = { workspace = true }
httpdate = "1"
jmap-peer-auth = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "sync"] }
url = { workspace = true }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "1.9", features = ["std"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
