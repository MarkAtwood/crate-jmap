[package]
name = "jmap-sharing-client"
version = "0.1.1"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JMAP Sharing HTTP client — extension trait over jmap-base-client (RFC 9670)"
keywords = ["jmap", "rfc9670", "client", "sharing"]
categories = ["network-programming", "asynchronous", "api-bindings"]

[dependencies]
jmap-types = { workspace = true }
jmap-sharing-types = { workspace = true }
jmap-base-client = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
