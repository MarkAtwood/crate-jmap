[package]
name = "jmap-chat-tasks-server"
version = "0.3.0"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Chat binding for the JMAP Tasks server (draft-atwood-jmap-chat-tasks-00): Space taskListId binding and auto-bind on create"
keywords = ["jmap", "tasks", "chat", "server"]
categories = ["network-programming", "web-programming::http-server"]

[dependencies]
jmap-types = { workspace = true }
jmap-chat-types = { workspace = true }
jmap-tasks-types = { workspace = true }
jmap-tasks-server = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
jmap-chat-server = { workspace = true, features = ["memory"] }
jmap-tasks-server = { workspace = true, features = ["memory"] }
