[package]
name = "jmap-blob-server"
version = "0.5.0"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JMAP Blob Management method handlers (Blob/set, get, lookup, convert; draft-ietf-jmap-blobext-03, RFC 9404) — backend-agnostic, plugs into jmap-server Dispatcher"
keywords = ["jmap", "blob", "server", "rfc9404"]
categories = ["network-programming", "web-programming::http-server"]
exclude = ["AGENTS.md", "CLAUDE.md", "PLAN.md"]

[features]
# Public, feature-gated in-memory reference implementation of BlobBackend.
# Not production — a reference impl, integration-test harness and
# documentation example. Mirrors the canonical jmap-mail-server `memory`
# feature (JMAP-hwdv.1).
memory = []
# Test knobs on the memory backend (stub converter, deferred-result
# failure, noPersist omission; docs/design/blobext.md §7).
test-helpers = ["memory"]

[dependencies]
jmap-types = { workspace = true }
jmap-blob-types = { workspace = true }
jmap-server = { workspace = true }
serde_json = { workspace = true }
