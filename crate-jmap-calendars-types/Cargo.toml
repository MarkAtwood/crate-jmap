[package]
name = "jmap-calendars-types"
authors = ["Mark Atwood <mark@reviewcommit.com>"]
repository = "https://github.com/MarkAtwood/crate-jmap"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "JMAP Calendars extension data types (draft-ietf-jmap-calendars-*)"
license = "MIT OR Apache-2.0"
keywords = ["jmap", "calendars", "types", "rfc8620"]
categories = ["encoding", "network-programming"]

[dependencies]
jmap-types = { path = "../crate-jmap-types", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
