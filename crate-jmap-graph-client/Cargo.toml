[package]
name = "jmap-graph-client"
version = "0.4.0"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JMAP Graph client (draft-atwood-jmap-graph-00, -graph-edit-00) — Graph, GraphNode, GraphEdge and GraphNodeOp method bindings over jmap-base-client"
keywords = ["jmap", "graph", "client"]
categories = ["network-programming", "asynchronous", "api-bindings"]

[dependencies]
jmap-base-client = { workspace = true }
jmap-graph-types = { workspace = true }
jmap-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
tokio-tungstenite = { workspace = true }
wiremock = { workspace = true }
