[package]
name = "jmap-chat-client"
version = "0.5.0"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JMAP Chat HTTP client — auth-agnostic, WebSocket and SSE support"
keywords = ["jmap", "draft-atwood-chat", "client", "chat"]
categories = ["network-programming", "asynchronous", "api-bindings"]
exclude = ["AGENTS.md", "CLAUDE.md", "PLAN.md"]

[dependencies]
jmap-types = { workspace = true }
jmap-chat-types = { workspace = true }
jmap-blob-client = { workspace = true }
jmap-blob-types = { workspace = true }
jmap-base-client = { workspace = true }
# urn:ietf:params:jmap:search: the URI and filter_uses_where, to add the
# capability to `using` when a Message filter sets `where`.
jmap-search = { workspace = true }
ulid = "1"
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
jmap-metadata-types = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
wiremock = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
