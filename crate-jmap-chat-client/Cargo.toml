[package]
name = "jmap-chat-client"
version = "0.1.1"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JMAP Chat HTTP client — auth-agnostic, WebSocket and SSE support"
keywords = ["jmap", "draft-atwood-chat", "client", "chat"]
categories = ["network-programming", "asynchronous", "api-bindings"]

[dependencies]
jmap-types = { workspace = true }
jmap-chat-types = { workspace = true }
jmap-base-client = { workspace = true }
ulid = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
wiremock = { workspace = true }
