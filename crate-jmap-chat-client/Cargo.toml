[package]
name = "jmap-chat-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "JMAP Chat HTTP client — auth-agnostic, WebSocket and SSE support"
license = "MIT OR Apache-2.0"

[dependencies]
jmap-types      = { path = "../crate-jmap-types" }
jmap-chat-types = { path = "../crate-jmap-chat-types" }
reqwest           = { version = "0.12", features = ["json", "stream", "rustls-tls-manual-roots"] }
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
thiserror         = "2"
tokio             = { version = "1", features = ["rt"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
url               = "2"

[dev-dependencies]
tokio       = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock    = "0.6"
