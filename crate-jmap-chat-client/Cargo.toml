[package]
name = "jmap-chat-client"
authors = ["Mark Atwood <mark@reviewcommit.com>"]
repository = "https://github.com/MarkAtwood/crate-jmap"
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
description = "JMAP Chat HTTP client — auth-agnostic, WebSocket and SSE support"
license = "MIT OR Apache-2.0"

[dependencies]
jmap-types        = { path = "../crate-jmap-types", version = "0.1.1" }
jmap-chat-types   = { path = "../crate-jmap-chat-types", version = "0.1.1" }
jmap-base-client  = { path = "../crate-jmap-base-client" , version = "0.1.1" }
ulid              = "1"
chrono            = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
thiserror         = "2"
tokio             = { version = "1", features = ["rt"] }

[dev-dependencies]
tokio       = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock    = "0.6"
