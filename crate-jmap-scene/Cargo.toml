[package]
name = "jmap-scene"
version = "0.6.1"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JMAP Scene (draft-atwood-jmap-scene-00): umbrella crate re-exporting jmap-scene-types, -client, and -server"
keywords = ["jmap", "scene", "spatial"]
categories = ["network-programming"]
exclude = ["AGENTS.md", "CLAUDE.md", "PLAN.md"]

[dependencies]
jmap-scene-types = { workspace = true }
jmap-scene-client = { workspace = true, optional = true }
jmap-scene-server = { workspace = true, optional = true }

[features]
client = ["dep:jmap-scene-client"]
server = ["dep:jmap-scene-server"]
# The server's in-memory reference backend (not production).
memory = ["server", "jmap-scene-server/memory"]

[dev-dependencies]
serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
