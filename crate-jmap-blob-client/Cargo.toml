[package]
name = "jmap-blob-client"
version = "0.6.2"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JMAP Blob Management HTTP client — extension trait over jmap-base-client (draft-ietf-jmap-blobext-03)"
keywords = ["jmap", "blob", "client", "rfc9404"]
categories = ["network-programming", "asynchronous", "api-bindings"]
exclude = ["AGENTS.md", "CLAUDE.md", "PLAN.md"]

[dependencies]
jmap-types = { workspace = true }
jmap-blob-types = { workspace = true }
jmap-base-client = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
