[package]
name = "jmap-graph-server"
version = "0.3.0"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JMAP Graph method handlers (draft-atwood-jmap-graph-00) — backend-agnostic, plugs into jmap-server Dispatcher"
keywords = ["jmap", "graph", "server"]
categories = ["network-programming", "web-programming::http-server"]

[features]
# Public, feature-gated in-memory reference implementation of GraphBackend.
# Not production — intended as a reference impl, integration-test harness, and
# documentation example. API stability is opt-in via this feature and may
# break across minor versions pre-1.0. Mirrors the canonical
# jmap-mail-server `memory` feature (JMAP-hwdv.1).
memory = ["dep:ulid"]

[dependencies]
# Validates and sizes base64url op and cursor `data`
# (draft-atwood-jmap-graph-edit-00 §GraphNodeOp/set, §GraphNode/cursor).
base64 = "0.22"
# RFC 5051 i;unicode-casemap for the graph-search `$collation`
# (draft-atwood-jmap-graph-search-00 §Collation), as in jmap-metadata-server.
icu_casemap = { workspace = true }
icu_normalizer = { workspace = true }
jmap-types = { workspace = true }
jmap-graph-types = { workspace = true }
jmap-server = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ulid = { version = "1", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# Tests use the public MemoryBackend reference impl from `src/memory.rs`.
# Self-dep with the `memory` feature ensures integration tests get the
# reference impl without exposing it to downstream users by default.
# Path-only, no version: cargo drops it on publish, so it never has to
# resolve against crates.io versions that lack these features (JMAP-31o4).
jmap-graph-server = { path = ".", features = ["memory"] }
