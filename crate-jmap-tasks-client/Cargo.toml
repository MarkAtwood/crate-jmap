[package]
name = "jmap-tasks-client"
authors = ["Mark Atwood <mark@reviewcommit.com>"]
repository = "https://github.com/MarkAtwood/crate-jmap"
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
description = "JMAP Tasks HTTP client — extension trait over jmap-base-client"
license = "MIT OR Apache-2.0"

[dependencies]
jmap-types       = { path = "../crate-jmap-types", version = "0.1.1" }
jmap-tasks-types = { path = "../crate-jmap-tasks-types", version = "0.1.1" }
jmap-base-client = { path = "../crate-jmap-base-client", version = "0.1.1" }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "2"

[dev-dependencies]
tokio    = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
