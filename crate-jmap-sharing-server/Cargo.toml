[package]
name = "jmap-sharing-server"
authors = ["Mark Atwood <mark@reviewcommit.com>"]
repository = "https://github.com/MarkAtwood/crate-jmap"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "JMAP Sharing method handlers — Principal and ShareNotification (RFC 9670)"
license = "MIT OR Apache-2.0"

[dependencies]
jmap-types          = { path = "../crate-jmap-types", version = "0.1.0" }
jmap-sharing-types  = { path = "../crate-jmap-sharing-types", version = "0.1.0" }
jmap-server         = { path = "../crate-jmap-server", version = "0.1.1" }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "2"
tokio      = { version = "1", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
