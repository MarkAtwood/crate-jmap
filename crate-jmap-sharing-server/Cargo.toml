[package]
name = "jmap-sharing-server"
version = "0.1.1"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JMAP Sharing method handlers — Principal and ShareNotification (RFC 9670)"
keywords = ["jmap", "rfc9670", "server", "sharing"]
categories = ["network-programming", "web-programming::http-server"]

[features]
# Public, feature-gated in-memory reference implementation of SharingBackend.
# Not production — intended as a reference impl, integration-test harness, and
# documentation example. API stability is opt-in via this feature and may
# break across minor versions pre-1.0. Mirrors the canonical
# jmap-mail-server `memory` feature (JMAP-hwdv.1).
memory = []

# Switches `MemoryBackend::demo_next_id` from the default deterministic
# `"<type><n:016x>"` pattern to a process-global timestamp+counter
# pattern matching the canonical `jmap-mail-server` `next_id` at
# `email.rs:1748`. Both modes are explicitly demonstration-quality;
# production backends must mint real ULIDs (or equivalent
# globally-unique, monotonic, persistent-across-restarts ids) and never
# use this helper as a copy-paste source.
realistic-demo-ids = []

[dependencies]
jmap-types = { workspace = true }
jmap-sharing-types = { workspace = true }
jmap-server = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# Tests use the public MemoryBackend reference impl from `src/memory.rs`.
# Self-dep with the `memory` feature ensures integration tests get the
# reference impl without exposing it to downstream users by default.
jmap-sharing-server = { workspace = true, features = ["memory"] }
