[package]
name = "jmap-filenode-server"
version = "0.3.0"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JMAP FileNode method handlers — backend-agnostic, plugs into jmap-server Dispatcher"
keywords = ["jmap", "draft-jmap-filenode", "server", "filenode"]
categories = ["network-programming", "web-programming::http-server"]

[features]
# Public, feature-gated in-memory reference implementation of FileNodeBackend.
# Not production — intended as a reference impl, integration-test harness, and
# documentation example. API stability is opt-in via this feature and may
# break across minor versions pre-1.0. Mirrors the canonical
# jmap-mail-server `memory` feature (JMAP-hwdv.1).
memory = ["dep:jmap-metadata-server"]

[dependencies]
jmap-types = { workspace = true }
jmap-filenode-types = { workspace = true }
jmap-cid-types = { workspace = true }
jmap-server = { workspace = true }
# draft-ietf-jmap-metadata-04 capability URI and DataTypeMetadataInfo
# (serde-only); the /set handler checks `using` against the URI.
jmap-metadata-types = { workspace = true }
serde_json = { workspace = true }
# draft-ietf-jmap-metadata-04 helpers the MemoryBackend wires in (JMAP-s4kp.6).
jmap-metadata-server = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# Tests use the public MemoryBackend reference impl from `src/memory.rs`.
# Self-dep with the `memory` feature ensures integration tests get the
# reference impl without exposing it to downstream users by default.
# Path-only, no version: cargo drops it on publish, so it never has to
# resolve against crates.io versions that lack these features (JMAP-31o4).
jmap-filenode-server = { path = ".", features = ["memory"] }
