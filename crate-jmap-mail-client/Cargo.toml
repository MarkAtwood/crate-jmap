[package]
name = "jmap-mail-client"
version = "0.1.1"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RFC 8621 JMAP for Mail client — Email, Mailbox, Thread, Identity, EmailSubmission methods"
keywords = ["jmap", "rfc8621", "client", "mail"]
categories = ["network-programming", "asynchronous", "api-bindings"]

[dependencies]
jmap-types = { workspace = true }
