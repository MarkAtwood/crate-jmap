[package]
name = "jmap-mail-client"
version = "0.6.0"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RFC 8621 JMAP for Mail client — Email, Mailbox, Thread, Identity, EmailSubmission methods"
keywords = ["jmap", "rfc8621", "client", "mail"]
categories = ["network-programming", "asynchronous", "api-bindings"]
exclude = ["AGENTS.md", "CLAUDE.md", "PLAN.md"]

[features]
# draft-ietf-jmap-emailpush-05: EmailPush subscriptions and push payload
# decoding.
emailpush = ["jmap-mail-types/emailpush"]

[dependencies]
jmap-types = { workspace = true }
jmap-mail-types = { workspace = true }
jmap-base-client = { workspace = true }
# urn:ietf:params:jmap:search: the URI and filter_uses_where, to add the
# capability to `using` when an Email filter sets `where`.
jmap-search = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Path-only self-dep so integration tests see the `emailpush` feature.
jmap-mail-client = { path = ".", features = ["emailpush"] }
jmap-metadata-types = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
