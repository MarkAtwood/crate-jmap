[package]
name = "jmap-mime"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MIME-to-JMAP adapter: converts mime_tree parsed output to jmap-mail-types body structures"
repository = "https://github.com/MarkAtwood/crate-jmap"

[dependencies]
jmap-types      = { path = "../crate-jmap-types", version = "0.1.1" }
jmap-mail-types = { path = "../crate-jmap-mail-types" , version = "0.1.1" }
mime-tree       = "0.1"

[dev-dependencies]
serde_json = { workspace = true }
