[package]
name = "jmap-object-history-client"
version = "0.6.0"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JMAP Object History client — extension trait over jmap-base-client (draft-ietf-jmap-object-history)"
keywords = ["jmap", "history", "undelete", "client"]
categories = ["network-programming", "asynchronous", "api-bindings"]
exclude = ["AGENTS.md", "CLAUDE.md", "PLAN.md"]

[dependencies]
jmap-base-client = { workspace = true }
jmap-object-history-types = { workspace = true }
jmap-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
