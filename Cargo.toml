[workspace]
members = [
    "crate-jmap-types",
    "crate-jmap-mail-types",
    "crate-jmap-mime",
    "crate-jmap-chat-types",
    "crate-jmap-contacts-types",
    "crate-jmap-calendars-types",
    "crate-jmap-tasks-types",
    "crate-jmap-filenode-types",
    "crate-jmap-sharing-types",
    "crate-jmap-server",
    "crate-jmap-mail-server",
    "crate-jmap-chat-server",
    "crate-jmap-contacts-server",
    "crate-jmap-calendars-server",
    "crate-jmap-tasks-server",
    "crate-jmap-filenode-server",
    "crate-jmap-sharing-server",
    "crate-jmap-base-client",
    "crate-jmap-chat-client",
    "crate-jmap-mail-client",
    "crate-jmap-contacts-client",
    "crate-jmap-calendars-client",
    "crate-jmap-tasks-client",
    "crate-jmap-filenode-client",
    "crate-jmap-sharing-client",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["Mark Atwood <mark@reviewcommit.com>"]
repository = "https://github.com/MarkAtwood/crate-jmap"

[workspace.dependencies]
jmap-types             = { path = "crate-jmap-types" }
jmap-mail-types        = { path = "crate-jmap-mail-types" }
jmap-chat-types        = { path = "crate-jmap-chat-types" }
jmap-contacts-types    = { path = "crate-jmap-contacts-types" }
jmap-calendars-types   = { path = "crate-jmap-calendars-types" }
jmap-tasks-types       = { path = "crate-jmap-tasks-types" }
jmap-filenode-types    = { path = "crate-jmap-filenode-types" }
jmap-sharing-types     = { path = "crate-jmap-sharing-types" }
jmap-mime              = { path = "crate-jmap-mime" }
jmap-server            = { path = "crate-jmap-server" }
jmap-mail-server       = { path = "crate-jmap-mail-server" }
jmap-chat-server       = { path = "crate-jmap-chat-server" }
jmap-contacts-server   = { path = "crate-jmap-contacts-server" }
jmap-calendars-server  = { path = "crate-jmap-calendars-server" }
jmap-tasks-server      = { path = "crate-jmap-tasks-server" }
jmap-filenode-server   = { path = "crate-jmap-filenode-server" }
jmap-sharing-server    = { path = "crate-jmap-sharing-server" }
jmap-base-client       = { path = "crate-jmap-base-client" }
jmap-mail-client       = { path = "crate-jmap-mail-client" }
jmap-chat-client       = { path = "crate-jmap-chat-client" }
jmap-contacts-client   = { path = "crate-jmap-contacts-client" }
jmap-calendars-client  = { path = "crate-jmap-calendars-client" }
jmap-tasks-client      = { path = "crate-jmap-tasks-client" }
jmap-filenode-client   = { path = "crate-jmap-filenode-client" }
jmap-sharing-client    = { path = "crate-jmap-sharing-client" }
mime-tree              = "0.1"
futures                = "0.3"
serde                  = { version = "1", features = ["derive"] }
serde_json             = "1"
thiserror              = "2"
tokio                  = { version = "1", features = ["rt"] }
http                   = "1"
reqwest                = { version = "0.12", features = ["json", "stream", "rustls-tls-webpki-roots"] }
tokio-tungstenite      = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
url                    = "2"
