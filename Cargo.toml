[package]
name = "jmap-mail-types"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "RFC 8621 JMAP for Mail data types (Mailbox, Thread, Email, Identity, EmailSubmission, SearchSnippet)"
license = "MIT OR Apache-2.0"
keywords = ["jmap", "email", "mail", "types", "rfc8621"]
categories = ["email", "encoding"]

[dependencies]
jmap-types = { path = "../crate-jmap-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
