jmap-metadata-types    = { path = "crate-jmap-metadata-types",   version = "0.6" }
jmap-cid-types         = { path = "crate-jmap-cid-types",        version = "0.6" }
jmap-did-types         = { path = "crate-jmap-did-types",        version = "0.6" }
jmap-peer-auth         = { path = "crate-jmap-peer-auth",        version = "0.6" }
