# Toy-consumer probes (AGENTS.md "End of each feature wave: toy-consumer
# check"): built outside the workspace by scripts/toy-consumers.sh.
exclude = ["docs/toy-consumers"]
resolver = "2"

[workspace.package]
edition = "2024"
# MSRV is 1.91 per bd:JMAP-6k5d.2 (raised from 1.88, bd:JMAP-ulfy): openmls
# 0.9.2, openmls_traits 0.6.0 and openmls_serialization_helpers 0.1.0, used by
# jmap-chat-mimi-server, declare rust-version 1.91.0. One workspace MSRV keeps
# every crate on a single, CI-verified floor.
rust-version = "1.91"
license = "MIT OR Apache-2.0"
authors = ["Mark Atwood <mark@reviewcommit.com>"]
repository = "https://github.com/MarkAtwood/crate-jmap"

# All sibling crate references include both `path` (for in-tree development
# and `cargo build --workspace`) AND `version` (required for `cargo publish`
# — crates.io strips the path attribute at upload time and uses only the
# version constraint to resolve the dep against the registry).
# See bd:JMAP-sc1b.10 / bd:JMAP-sc1b.23. The requirement is the current
# shared minor line (`version = "0.6"`, caret), so any 0.6.x sibling
# satisfies it; bump every entry together on the next breaking release
# (RELEASING.md "Version bump conventions"). List only crates some member
# depends on: cargo's unused_workspace_dependencies lint flags the rest.
[workspace.dependencies]
jmap-types             = { path = "crate-jmap-types",            version = "0.6" }
jmap-mail-types        = { path = "crate-jmap-mail-types",       version = "0.6" }
jmap-chat-types        = { path = "crate-jmap-chat-types",       version = "0.6" }
jmap-contacts-types    = { path = "crate-jmap-contacts-types",   version = "0.6" }
jmap-calendars-types   = { path = "crate-jmap-calendars-types",  version = "0.6" }
jmap-tasks-types       = { path = "crate-jmap-tasks-types",      version = "0.6" }
jmap-filenode-types    = { path = "crate-jmap-filenode-types",   version = "0.6" }
jmap-quotas-types      = { path = "crate-jmap-quotas-types",     version = "0.6" }
jmap-quotas-server     = { path = "crate-jmap-quotas-server",    version = "0.6" }
jmap-quotas-client     = { path = "crate-jmap-quotas-client",    version = "0.6" }
jmap-blob-types        = { path = "crate-jmap-blob-types",       version = "0.6" }
jmap-blob-server       = { path = "crate-jmap-blob-server",      version = "0.6" }
jmap-blob-client       = { path = "crate-jmap-blob-client",      version = "0.6" }
jmap-object-history-types  = { path = "crate-jmap-object-history-types",  version = "0.6" }
jmap-object-history-server = { path = "crate-jmap-object-history-server", version = "0.6" }
jmap-object-history-client = { path = "crate-jmap-object-history-client", version = "0.6" }
jmap-sharing-types     = { path = "crate-jmap-sharing-types",    version = "0.6" }
jmap-jscalendar-types  = { path = "crate-jmap-jscalendar-types", version = "0.6" }
