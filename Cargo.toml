jmap-sharing-server    = { path = "crate-jmap-sharing-server",   version = "0.6" }
jmap-vtc-server        = { path = "crate-jmap-vtc-server",       version = "0.6" }
jmap-scene-server      = { path = "crate-jmap-scene-server",     version = "0.6" }
jmap-graph-server      = { path = "crate-jmap-graph-server",     version = "0.6" }
jmap-base-client       = { path = "crate-jmap-base-client",      version = "0.6" }
jmap-chat-client       = { path = "crate-jmap-chat-client",      version = "0.6" }
jmap-mail-client       = { path = "crate-jmap-mail-client",      version = "0.6" }
jmap-filenode-client   = { path = "crate-jmap-filenode-client",  version = "0.6" }
jmap-sharing-client    = { path = "crate-jmap-sharing-client",   version = "0.6" }
jmap-metadata-client   = { path = "crate-jmap-metadata-client",  version = "0.6" }
jmap-vtc-client        = { path = "crate-jmap-vtc-client",       version = "0.6" }
jmap-scene-client      = { path = "crate-jmap-scene-client",     version = "0.6" }
jmap-graph-client      = { path = "crate-jmap-graph-client",     version = "0.6" }
jmap-tasks-client      = { path = "crate-jmap-tasks-client",     version = "0.6" }
jmap-contacts-client   = { path = "crate-jmap-contacts-client",  version = "0.6" }
jmap-calendars-client  = { path = "crate-jmap-calendars-client", version = "0.6" }
jmap-websocket         = { path = "crate-jmap-websocket",        version = "0.6" }
mime-tree              = "0.6"
futures                = "0.3"
serde                  = { version = "1", features = ["derive"] }
serde_json             = "1"
# Names the offending property in typed-parse invalidProperties SetErrors
# (RFC 8620 §5.3). Already in the tree via axum.
serde_path_to_error    = "0.1"
# RFC 3986 URI / RFC 3987 IRI syntax (jmap-types uri module, jmap-base-client
# IRI mapping; draft-atwood-jmap-updates-00 §7.1, decision 29). The `url`
# crate is WHATWG and stays for HTTP. Already in the tree via reqwest.
iri-string             = { version = "0.7", default-features = false, features = ["alloc"] }
# UTS #46 A-label <-> U-label host mapping for the IRI helpers in
# jmap-base-client. Already in the tree via url.
idna                   = "1"
# ICU4X simple titlecase and NFKD for the RFC 5051 "i;unicode-casemap"
# collation (jmap-metadata-server metadataTextContains). Same 2.2 release
# as the transitive icu_* crates, so both steps use one Unicode version.
icu_casemap            = { version = "2.2", default-features = false, features = ["compiled_data"] }
icu_normalizer         = { version = "2.2", default-features = false, features = ["compiled_data"] }
# ICU4X UAX #29 extended grapheme clusters for jmap-types text truncation
# (draft-atwood-jmap-updates-00 §6.5, decision 29). Any 2.x from 2.2,
# like the icu_* crates above: Cargo resolves one 2.x release for all of
# them, so the tree still has one Unicode version, and dependents can
# take a newer ICU4X 2.x.
icu_segmenter          = { version = "2.2", default-features = false, features = ["compiled_data"] }
# Constant-time cryptographic primitives. Used for credential comparisons
# (e.g. invite-code lookup in jmap-chat-server) to defeat byte-by-byte
# timing oracles. Pure-Rust, RustCrypto-stack — matches the workspace's
# rustls/RustCrypto-first stance. See bd:JMAP-sc1b.89.
subtle                 = "2.6"
# OS CSPRNG. Currently consumed only by jmap-chat-server (memory feature)
# for invite-code generation, but hoisted to workspace.dependencies so a
# future second consumer (federation-token / blob-id helper / etc.) pins
# to the same version. The workspace MSRV (1.91) is well ahead of
# getrandom 0.3's required 1.60. See bd:JMAP-x2gd.66.
getrandom              = "0.3"
# Drop-path zeroization for credential-bearing String / Vec<u8> fields
# (e.g. BearerAuth.header_string, BasicAuth.header_string + plaintext
# intermediate). Defends against credential recovery from process core
# dumps, /proc/PID/mem, and post-drop heap inspection by overwriting the
# buffer before returning it to the allocator. RustCrypto-stack crate,
# pure-Rust, no_std-compatible. See bd:JMAP-6r7c.59.
zeroize                = "1.8"
# base64url for JWT segments (jmap-platform-push FCM and APNs tokens).
# Already in the tree via reqwest and jmap-web-push.
base64                 = "0.22"
# RS256 (RSASSA-PKCS1-v1_5 SHA-256) for the Google service-account JWT of
# FCM HTTP v1 (jmap-platform-push). Already in the tree as the rustls
# crypto provider of reqwest, and constant-time where pure-Rust `rsa` has
# a history of timing side channels (RUSTSEC-2023-0071); `rsa` is a test
# oracle only.
ring                   = "0.17"
# ES256 for the APNs provider token (jmap-platform-push), parsed from the
# PKCS #8 `.p8` key Apple issues. Already in the tree via jmap-web-push and
# jmap-did-types.
p256                   = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
# Dev-only (jmap-vtc-aws tests): verifies the ES384 IVS playback tokens,
# which ring signs, with an independent implementation. Already in the
# tree via openmls_rust_crypto.
p384                   = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
thiserror              = "2"
tokio                  = { version = "1", features = ["rt"] }
http                   = "1"
reqwest                = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots"] }
tokio-tungstenite      = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
url                    = "2"
tracing                = "0.1"
# Dev-only deps. Hoisted to [workspace.dependencies] so per-crate
# Cargo.toml dev-dependencies blocks can use `<dep> = { workspace = true }`
# and a future version bump touches one file instead of N. See bd:JMAP-ops7.32.
wiremock               = "0.6"
# Dev-only (jmap-platform-push tests): generates throwaway RS256 keys and
# verifies RS256 signatures independently of ring. 0.10, not 0.9: 0.9 is
# RUSTSEC-2023-0071 (Marvin), fixed in the 0.10 crypto-bigint rewrite.
rsa                    = { version = "0.10", default-features = false, features = ["std", "encoding", "getrandom", "pkcs1v15"] }
criterion              = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
tracing-subscriber     = { version = "0.3", default-features = false, features = ["fmt"] }
