[workspace]
members = [
    "crate-jmap-types",
    "crate-jmap-mail-types",
    "crate-jmap-mime",
    "crate-jmap-chat-types",
    "crate-jmap-contacts-types",
    "crate-jmap-calendars-types",
    "crate-jmap-tasks-types",
    "crate-jmap-filenode-types",
    "crate-jmap-sharing-types",
    "crate-jmap-server",
    "crate-jmap-mail-server",
    "crate-jmap-chat-server",
    "crate-jmap-contacts-server",
    "crate-jmap-calendars-server",
    "crate-jmap-tasks-server",
    "crate-jmap-filenode-server",
    "crate-jmap-sharing-server",
    "crate-jmap-base-client",
    "crate-jmap-chat-client",
    "crate-jmap-mail-client",
    "crate-jmap-contacts-client",
    "crate-jmap-calendars-client",
    "crate-jmap-tasks-client",
    "crate-jmap-filenode-client",
    "crate-jmap-sharing-client",
]
resolver = "2"

[workspace.package]
edition = "2021"
# MSRV is 1.88 per workspace policy decision in bd:JMAP-ulfy. The declared
# value tracks the actual minimum (transitive deps icu_*@2.2.0 require
# rustc 1.86 and hashbrown@0.17.0 needs the edition2024 Cargo feature
# stabilized in 1.85). Picking 1.88 over 1.86 gives a small safety margin
# against further dep churn and matches the toolchain that has been verified
# locally and in CI.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Mark Atwood <mark@reviewcommit.com>"]
repository = "https://github.com/MarkAtwood/crate-jmap"

# All sibling crate references include both `path` (for in-tree development
# and `cargo build --workspace`) AND `version` (required for `cargo publish`
# — crates.io strips the path attribute at upload time and uses only the
# version constraint to resolve the dep against the registry).
# See bd:JMAP-sc1b.10 / bd:JMAP-sc1b.23. Use `version = "0.1"` (caret-major)
# so any 0.1.x release of a sibling satisfies the constraint; bump to
# `version = "0.2"` workspace-wide when the coordinated 0.2 API-break beads
# (bd:JMAP-g7wu.1 CallerCtx, bd:JMAP-g7wu.3 helpers builder, bd:JMAP-g7wu.9
# UTCDate, bd:JMAP-r3pg.14 extract_account_id) land together.
[workspace.dependencies]
jmap-types             = { path = "crate-jmap-types",            version = "0.1" }
jmap-mail-types        = { path = "crate-jmap-mail-types",       version = "0.1" }
jmap-chat-types        = { path = "crate-jmap-chat-types",       version = "0.1" }
jmap-contacts-types    = { path = "crate-jmap-contacts-types",   version = "0.1" }
jmap-calendars-types   = { path = "crate-jmap-calendars-types",  version = "0.1" }
jmap-tasks-types       = { path = "crate-jmap-tasks-types",      version = "0.1" }
jmap-filenode-types    = { path = "crate-jmap-filenode-types",   version = "0.1" }
jmap-sharing-types     = { path = "crate-jmap-sharing-types",    version = "0.1" }
jmap-mime              = { path = "crate-jmap-mime",             version = "0.1" }
jmap-server            = { path = "crate-jmap-server",           version = "0.1" }
jmap-mail-server       = { path = "crate-jmap-mail-server",      version = "0.1" }
jmap-chat-server       = { path = "crate-jmap-chat-server",      version = "0.1" }
jmap-contacts-server   = { path = "crate-jmap-contacts-server",  version = "0.1" }
jmap-calendars-server  = { path = "crate-jmap-calendars-server", version = "0.1" }
jmap-tasks-server      = { path = "crate-jmap-tasks-server",     version = "0.1" }
jmap-filenode-server   = { path = "crate-jmap-filenode-server",  version = "0.1" }
jmap-sharing-server    = { path = "crate-jmap-sharing-server",   version = "0.1" }
jmap-base-client       = { path = "crate-jmap-base-client",      version = "0.1" }
jmap-mail-client       = { path = "crate-jmap-mail-client",      version = "0.1" }
jmap-chat-client       = { path = "crate-jmap-chat-client",      version = "0.1" }
jmap-contacts-client   = { path = "crate-jmap-contacts-client",  version = "0.1" }
jmap-calendars-client  = { path = "crate-jmap-calendars-client", version = "0.1" }
jmap-tasks-client      = { path = "crate-jmap-tasks-client",     version = "0.1" }
jmap-filenode-client   = { path = "crate-jmap-filenode-client",  version = "0.1" }
jmap-sharing-client    = { path = "crate-jmap-sharing-client",   version = "0.1" }
mime-tree              = "0.1"
futures                = "0.3"
serde                  = { version = "1", features = ["derive"] }
serde_json             = "1"
thiserror              = "2"
tokio                  = { version = "1", features = ["rt"] }
http                   = "1"
reqwest                = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots"] }
tokio-tungstenite      = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
url                    = "2"
