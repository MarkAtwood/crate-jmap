[package]
name = "jmap-chat-server"
version = "0.3.0"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JMAP Chat extension method handlers — backend-agnostic, plugs into jmap-server Dispatcher"
keywords = ["jmap", "draft-atwood-chat", "server", "chat"]
categories = ["network-programming", "web-programming::http-server"]

[features]
# Public, feature-gated in-memory reference implementation of ChatBackend.
# Not production — intended as a reference impl, integration-test harness, and
# documentation example. API stability is opt-in via this feature and may
# break across minor versions pre-1.0. Mirrors the canonical
# jmap-mail-server `memory` feature (JMAP-hwdv.1).
#
# Enabling `memory` pulls in `getrandom` so the reference
# `generate_invite_code` impl can satisfy the CSPRNG contract documented on
# the `ChatBackend::generate_invite_code` trait method (bd:JMAP-sc1b.93).
memory = ["dep:getrandom", "dep:uuid"]
# Test-only seams on MemoryBackend (the `*_for_test` methods): seeding and
# policy knobs for integration tests, here and in sibling crates. Not part of
# any supported API surface. Integration tests enable it via the self
# dev-dependency below (bd:JMAP-ic0j.73).
test-helpers = ["memory"]

[dependencies]
jmap-types = { workspace = true }
jmap-chat-types = { workspace = true }
# `Did` parses ChatContact/set `did` (draft-atwood-jmap-chat-did-00).
jmap-did-types = { workspace = true }
# DID-keyed peer auth (draft-atwood-jmap-chat-did-00 §Federation
# Authentication) reuses the RFC 9421 verification of the I/O-free
# peer-auth crate; base64 decodes `publicKeyJwk` `x`.
jmap-peer-auth = { workspace = true }
base64 = "0.22"
jmap-server = { workspace = true }
# `serde::de::DeserializeOwned` trait bound on Space/set patch-entry parsers;
# matches sibling jmap-mail-server / jmap-server dep set.
serde = { workspace = true }
serde_json = { workspace = true }
# Constant-time invite-code comparison in Space/join (bd:JMAP-sc1b.89).
subtle = { workspace = true }
# CSPRNG for the `memory` reference backend. Only pulled in when `memory`
# is enabled — production deployments ship their own ChatBackend impl that
# carries its own randomness story. Pinned to 0.3 (current stable line);
# Hoisted to [workspace.dependencies] so a future second consumer of
# getrandom in the workspace pins to the same version. See bd:JMAP-x2gd.66.
getrandom = { workspace = true, optional = true }
uuid = { version = "1", default-features = false, features = ["v4", "std"], optional = true }

[dev-dependencies]
http = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# Tests use the public MemoryBackend reference impl from `src/memory.rs`.
# Self-dep with the `memory` feature ensures integration tests get the
# reference impl without exposing it to downstream users by default.
# Path-only, no version: cargo drops it on publish, so it never has to
# resolve against crates.io versions that lack these features (JMAP-31o4).
jmap-chat-server = { path = ".", features = ["memory", "test-helpers"] }
