# typos-cli configuration for the jmap-* crate-family workspace.
#
# Wired into CI via .github/workflows/ci.yml:typos. Run locally with
# `cargo install typos-cli` then `typos`. To suppress an additional false
# positive, add it under [default.extend-words] (key = "found-word",
# value = "found-word" preserves the original spelling).

[files]
# did:plc audit logs fetched from plc.directory and generated by the
# reference implementation: base58/base64url keys, signatures and CIDs.
extend-exclude = [
    "crate-jmap-did-types/tests/fixtures/plc/*.json",
    "crate-jmap-did-resolver/tests/fixtures/plc/*.json",
    # DIF did:webvh test-suite vectors: base58btc hashes, keys and
    # signatures.
    "crate-jmap-did-types/tests/fixtures/webvh/",
]

[default]
# Random credential canaries in redaction tests (e.g.
# crate-jmap-base-client/src/ws/mod.rs) are not words.
extend-ignore-re = [
    "redaction-canary-cred-[A-Za-z0-9]+",
    # RFC 4648 §10 base64 test vector `"fo"` -> `"Zm8"`
    # (crate-jmap-chat-server/src/memory.rs base64url test). Not a word.
    '\("fo", "Zm8"\)',
    # GroupInfo/fetch `request` from draft-atwood-jmap-chat-mimi-00
    # §Examples (crate-jmap-chat-mimi-types/src/groupinfo.rs). Base64url,
    # not a word.
    "AAEAAQAgsJ4f",
    # RFC 8291 §5 receiver public key and RFC 8292 §2.4 VAPID `k`
    # (crate-jmap-web-push tests). Base64url, not words.
    "BCVxsr7N_eNgVRqvHtD0zTZsEc6-VV-JvLexhqUzORcxaOzi6-AYWXvTBHm4bjyPjs7Vd8pZGH6SRpkNtoIAiw4",
    "BA1Hxzyi1RUM1b5wjxsn7nGxAszw2u61m164i3MrAIxHF6YK5h4SDYic-dRuU_RCPCfA5aq9ojSwk5Y2EmClBPs",
    # RFC 9421 Appendix B.1.4 test-key-ed25519 JWK `x` (crate-jmap-peer-auth
    # tests). Base64url, not a word.
    "JrQLj5P_89iXES9-vFgrIy29clF9CC_oPPsw3c5D0bs",
]

[default.extend-words]
# `mis` — the hyphenated prefix in "mis-expand", "mis-routed",
# "mis-classifying". Not a typo of `miss`.
mis = "mis"

# `unparseable` — accepted spelling, used throughout error text and tests.
unparseable = "unparseable"

# `opperator` — deliberate misspelling of `operator` in FilterOperator
# deserialization tests (crate-jmap-types/src/query.rs).
opperator = "opperator"

# `ser` — short alias for the helpers::ser serialize function exported by
# jmap-server (see crate-jmap-server/README.md). Not a typo of `set`.
ser = "ser"

# `nd` — short variable binding for `not_destroyed` map references in test
# code (e.g. crate-jmap-filenode-server/src/filenode.rs around line 1296).
# Not a typo of `and`.
nd = "nd"

# `ue` — short variable binding for `unread_emails` map field in mail-server
# integration test harness (crate-jmap-mail-server/tests/common/mod.rs).
# Not a typo of `use` / `due`.
ue = "ue"

# `thr` — fixture identifier prefix used in the JMAP test fixtures (e.g.
# `"threadId": "thr1"`), mirroring fixtures used in production JMAP test
# suites. Not a typo of `the`.
thr = "thr"

# `alls` — appears as "catch-alls" in PLAN.md prose. Real English word
# (plural of catch-all).
alls = "alls"

# `assigneee` — three-`e` spelling in JMAP Tasks draft §4.2.3 (verbatim
# from the spec). The tasks-types README documents this spec typo so
# implementors recognise it; we preserve the original misspelling rather
# than silently normalising and confusing readers who go looking.
assigneee = "assigneee"

# `hge` — appears as part of beads (bd) issue identifiers like `JMAP-hge6`.
# typos suggests it should be `he`; preserve as-is so cross-references in
# commit messages, comments, and docstrings to bead IDs stay accurate.
hge = "hge"
