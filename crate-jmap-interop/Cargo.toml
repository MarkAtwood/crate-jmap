[package]
name = "jmap-interop"
version = "0.0.0"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Opt-in interop tests of the jmap-* clients against an external JMAP server (Stalwart in a container). Test-only; never published."
# Test-only (bd:JMAP-cyub.2): never published, not in RELEASING.md's
# publish list, skipped by scripts/public-api.sh. Every test is #[ignore]d
# and needs JMAP_INTEROP_URL, so `cargo test --workspace` needs no server.
publish = false

[dependencies]
jmap-base-client = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
