[package]
name = "jmap-interop"
version = "0.0.0"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Opt-in interop tests of the jmap-* clients against an external JMAP server (Stalwart in a container). Test-only; never published."
# Test-only (bd:JMAP-cyub.2): never published, not in RELEASING.md's
# publish list, skipped by scripts/public-api.sh. Every test is #[ignore]d
# and needs JMAP_INTEROP_URL, so `cargo test --workspace` needs no server.
publish = false

[dependencies]
jmap-base-client = { workspace = true }
# `exclusive`: one server test at a time per test binary.
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
jmap-mail-client = { workspace = true }
jmap-mail-types = { workspace = true }
jmap-types = { workspace = true }
serde_json = { workspace = true }
# Blob upload bodies for Email/import (jmap-base-client takes bytes::Bytes).
bytes = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
