[package]
name = "jmap-calendars-client"
version = "0.3.0"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JMAP Calendars HTTP client — extension trait over jmap-base-client"
keywords = ["jmap", "draft-jmap-calendars", "client", "calendars"]
categories = ["network-programming", "asynchronous", "api-bindings"]

[dependencies]
jmap-types = { workspace = true }
jmap-calendars-types = { workspace = true }
jmap-base-client = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
jmap-metadata-types = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock = { workspace = true }
