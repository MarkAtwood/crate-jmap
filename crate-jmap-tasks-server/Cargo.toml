[package]
name = "jmap-tasks-server"
authors = ["Mark Atwood <mark@reviewcommit.com>"]
repository = "https://github.com/MarkAtwood/crate-jmap"
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
description = "JMAP Tasks method handlers — backend-agnostic, plugs into jmap-server Dispatcher"
license = "MIT OR Apache-2.0"

[dependencies]
jmap-types       = { path = "../crate-jmap-types", version = "0.1.1" }
jmap-tasks-types = { path = "../crate-jmap-tasks-types", version = "0.1.1" }
jmap-server      = { path = "../crate-jmap-server", version = "0.1.2" }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "2"
tokio      = { version = "1", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
