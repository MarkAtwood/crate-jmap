[package]
name = "jmap-sharing-types"
authors = ["Mark Atwood <mark@reviewcommit.com>"]
repository = "https://github.com/MarkAtwood/crate-jmap"
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
description = "JMAP Sharing data types — Principal and ShareNotification (RFC 9670)"
license = "MIT OR Apache-2.0"
keywords = ["jmap", "sharing", "types", "rfc9670"]
categories = ["encoding", "network-programming"]

[dependencies]
jmap-types = { path = "../crate-jmap-types", version = "0.1.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
