[package]
name = "jmap-testjig"
version = "0.0.0"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "In-process JMAP test jig — NOT a JMAP server consumers should run; in-memory only, single-user, no auth integration, no persistence. Internal scaffolding for the workspace's integration testing and demonstration."
publish = false

# This crate ships both a binary and a library entrypoint:
# - `cargo run -p jmap-testjig` starts the jig on a hardcoded localhost port.
# - `jmap_testjig::spawn_in_process(..)` lets per-client-crate integration
#   tests embed the jig in their own tokio runtime (filed as JMAP-cf7p.7).
[lib]
name = "jmap_testjig"
path = "src/lib.rs"

[[bin]]
name = "jmap-testjig"
path = "src/main.rs"

[dependencies]
# The 8 extension server crates plus the dispatcher foundation. Each
# extension crate is pulled in with its `memory` feature so the
# reference MemoryBackend is available to mount on the dispatcher.
# All 8 reference impls use `type CallerCtx = ();` which lines up with
# the testjig's single-hardcoded-principal posture.
jmap-server = { workspace = true }
jmap-mail-server = { workspace = true, features = ["memory"] }
jmap-chat-server = { workspace = true, features = ["memory"] }
jmap-calendars-server = { workspace = true, features = ["memory"] }
jmap-tasks-server = { workspace = true, features = ["memory"] }
jmap-contacts-server = { workspace = true, features = ["memory"] }
jmap-filenode-server = { workspace = true, features = ["memory"] }
jmap-sharing-server = { workspace = true, features = ["memory"] }
jmap-types = { workspace = true }

# Each *-types crate is pulled in alongside its *-server pair so the
# SSE poller (slice bd:JMAP-cf7p.4) can name the [`JmapObject`]
# implementors directly when calling `MemoryBackend::get_state::<O>`.
# The *-server crates do not re-export their *-types, so each needs
# an explicit dep here.
jmap-mail-types = { workspace = true }
jmap-chat-types = { workspace = true }
jmap-calendars-types = { workspace = true }
jmap-tasks-types = { workspace = true }
jmap-contacts-types = { workspace = true }
jmap-filenode-types = { workspace = true }
jmap-sharing-types = { workspace = true }

# Serde for request/response JSON shapes plumbed through the dispatcher
# (the dispatcher itself uses serde_json::Value internally).
serde = { workspace = true }
serde_json = { workspace = true }

# tokio: multi-thread runtime + macros + signal so `cargo run` can
# shut down cleanly on Ctrl+C. The workspace's `tokio` dep advertises
# only `rt`; the testjig opts into the additional features it needs
# without bloating siblings.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync"] }

# HTTP transport — axum is introduced for the first time in the
# workspace by this crate. Per the workspace TLS-stack convention
# (workspace AGENTS.md), no `native-tls` / `openssl` / `default-tls`
# features. axum itself is TLS-agnostic; the operator terminates TLS
# in front of the testjig (or in a future slice we add axum-server with
# rustls). 0.7 is the current major; we pin caret-minor for now.
#
# The `ws` feature pulls in `axum::extract::ws` (WebSocketUpgrade /
# WebSocket / Message) for slice bd:JMAP-cf7p.5. axum's `ws` feature
# pulls in `tokio-tungstenite` transitively but the workspace dep on
# `tokio-tungstenite` below is kept separately so integration tests
# can build a client-side WS connection against the testjig without
# reaching through axum.
axum = { version = "0.8", features = ["ws"] }

# `http` is the `Request`/`Response`/`StatusCode`/`header` foundation
# shared with axum. Workspace-declared (used by jmap-server's
# RequestError helper) so version-pin stays consistent.
http = { workspace = true }

# `http-body-util` provides `LengthLimitError`, which axum's
# `to_bytes(.., limit)` returns inside its error chain when the body
# exceeds the cap. The testjig needs to distinguish "too big" from
# generic transport faults so it can emit RFC 8620 `requestTooLarge`
# (HTTP 400) rather than a generic 4xx. Pinned to the same minor as
# axum's transitive dep.
http-body-util = "0.1"

# `axum-core` exposes the error type returned by `axum::body::to_bytes`
# so the testjig can walk its `Error::source` chain looking for
# `LengthLimitError`. Pulled in directly (rather than reached through
# the axum transitive) so a future axum minor bump cannot silently
# break access to the type.
axum-core = "0.5"

# WebSocket — for slice JMAP-cf7p.5 the testjig will use axum's built-in
# axum::extract::ws path rather than tokio-tungstenite directly. We
# still declare tokio-tungstenite as a workspace dep so future slices
# that need direct WS framing (e.g. a self-test that opens a client WS
# connection back into the testjig) have it on hand without re-deriving
# the feature set. The workspace dep is pinned rustls-only — see
# workspace.dependencies in the root Cargo.toml.
tokio-tungstenite = { workspace = true }

# tokio-stream — wraps a `tokio::sync::mpsc::Receiver<T>` as a
# `futures_core::Stream<Item = T>`, which is what axum's
# `Sse::new(stream)` constructor accepts. Used by the SSE handler
# (slice bd:JMAP-cf7p.4) to push polling-derived StateChange events
# from a background task into the event-source response without
# adding a heavier `async-stream` macro dep or hand-rolling a
# `Stream` impl.
tokio-stream = "0.1"

# Constant-time token comparison for the hardcoded bearer auth middleware
# (slice JMAP-cf7p.6). Pulled in early so the scaffold dep set already
# advertises it; the auth layer will use `subtle::ConstantTimeEq::ct_eq`
# per the workspace's secret-comparison policy (see jmap-chat-server's
# invite-code precedent in src/space.rs).
subtle = { workspace = true }

[dev-dependencies]
# Multi-thread runtime + macros for #[tokio::test] across the
# in-process spawn integration tests.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net"] }

# `tower::ServiceExt::oneshot` drives the axum router from a single
# `http::Request` inside unit tests without binding a real socket.
# `util` is the smallest feature that provides `oneshot`.
tower = { version = "0.5", features = ["util"] }

# `http_body_util::BodyExt::collect` reads the response body into bytes
# in test code; same crate as the production `LengthLimitError`
# dependency, so no extra version surface.
http-body-util = "0.1"

# `reqwest` is the canonical HTTP client the workspace already uses
# for jmap-base-client. The spawn_in_process integration tests
# (bd:JMAP-cf7p.7) build a reqwest client against the jig's bound
# port to exercise the public spawn API end-to-end. The workspace
# dep already pins default-features=false + rustls-tls per the
# workspace TLS-stack convention.
reqwest = { workspace = true }

# `futures-util` is needed by the WebSocket integration test
# (bd:JMAP-cf7p.5) to drive `WebSocketStream`'s `StreamExt::next` and
# `SinkExt::send` extension methods. Transitively present through
# reqwest's `stream` feature but kept as an explicit dev-dep so the
# test's import lines do not depend on transitive resolution.
futures-util = { version = "0.3", default-features = false }
