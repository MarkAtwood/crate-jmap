[package]
name = "jmap-contacts-client"
version = "0.1.1"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JMAP Contacts HTTP client — extension trait over jmap-base-client"
keywords = ["jmap", "rfc9610", "client", "contacts"]
categories = ["network-programming", "asynchronous", "api-bindings"]

[dependencies]
jmap-types = { workspace = true }
jmap-contacts-types = { workspace = true }
jmap-base-client = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock = { workspace = true }
