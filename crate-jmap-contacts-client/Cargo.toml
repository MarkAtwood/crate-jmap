[package]
name = "jmap-contacts-client"
authors = ["Mark Atwood <mark@reviewcommit.com>"]
repository = "https://github.com/MarkAtwood/crate-jmap"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "JMAP Contacts HTTP client — extension trait over jmap-base-client"
license = "MIT OR Apache-2.0"

[dependencies]
jmap-types          = { path = "../crate-jmap-types", version = "0.1.0" }
jmap-contacts-types = { path = "../crate-jmap-contacts-types", version = "0.1.0" }
jmap-base-client    = { path = "../crate-jmap-base-client", version = "0.1.0" }
serde_json = "1"
thiserror  = "2"

[dev-dependencies]
tokio    = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
