[package]
name = "jmap-blob"
version = "0.6.0"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JMAP Blob Management (draft-ietf-jmap-blobext-03, with RFC 9404 legacy support): umbrella crate re-exporting jmap-blob-types, -client, and -server"
keywords = ["jmap", "blob", "rfc9404"]
categories = ["network-programming"]
exclude = ["AGENTS.md", "CLAUDE.md", "PLAN.md"]

[dependencies]
jmap-blob-types = { workspace = true }
jmap-blob-client = { workspace = true, optional = true }
jmap-blob-server = { workspace = true, optional = true }

[features]
client = ["dep:jmap-blob-client"]
server = ["dep:jmap-blob-server"]
# The server's in-memory reference backend (not production).
memory = ["server", "jmap-blob-server/memory"]

[dev-dependencies]
serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
