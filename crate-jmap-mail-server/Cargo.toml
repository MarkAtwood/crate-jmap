[package]
name = "jmap-mail-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "RFC 8621 JMAP for Mail method handlers — backend-agnostic, plugs into jmap-server Dispatcher"
license = "MIT OR Apache-2.0"

[dependencies]
jmap-types      = { path = "../crate-jmap-types" }
jmap-mail-types = { path = "../crate-jmap-mail-types" }
jmap-server     = { path = "../crate-jmap-server" }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "2"
tokio      = { version = "1", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid  = { version = "1", features = ["v4"] }
