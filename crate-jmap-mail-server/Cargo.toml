[package]
name = "jmap-mail-server"
version = "0.1.2"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RFC 8621 JMAP for Mail method handlers — backend-agnostic, plugs into jmap-server Dispatcher"
keywords = ["jmap", "rfc8621", "server", "mail"]
categories = ["network-programming", "web-programming::http-server"]

[features]
mdn = ["jmap-mail-types/mdn"]
sieve = ["jmap-mail-types/sieve"]

[dependencies]
jmap-types = { workspace = true }
jmap-mail-types = { workspace = true }
jmap-server = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
uuid = { version = "1", default-features = false, features = ["v4", "std"] }
mime-tree = { workspace = true }
jmap-mime = { workspace = true }
