[package]
name = "jmap-mail-server"
authors = ["Mark Atwood <mark@reviewcommit.com>"]
repository = "https://github.com/MarkAtwood/crate-jmap"
version = "0.1.2"
edition = "2021"
rust-version = "1.75"
description = "RFC 8621 JMAP for Mail method handlers — backend-agnostic, plugs into jmap-server Dispatcher"
license = "MIT OR Apache-2.0"

[features]
mdn = ["jmap-mail-types/mdn"]
sieve = ["jmap-mail-types/sieve"]

[dependencies]
jmap-types      = { path = "../crate-jmap-types", version = "0.1.1" }
jmap-mail-types = { path = "../crate-jmap-mail-types", version = "0.1.1" }
jmap-server     = { path = "../crate-jmap-server", version = "0.1.2" }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "2"
tokio      = { version = "1", features = ["rt"] }

[dev-dependencies]
tokio     = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid      = { version = "1", features = ["v4"] }
mime-tree = { workspace = true }
jmap-mime = { path = "../crate-jmap-mime" , version = "0.1.1" }
