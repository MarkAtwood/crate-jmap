[package]
name = "jmap-mail-server"
version = "0.3.0"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RFC 8621 JMAP for Mail method handlers — backend-agnostic, plugs into jmap-server Dispatcher"
keywords = ["jmap", "rfc8621", "server", "mail"]
categories = ["network-programming", "web-programming::http-server"]

[features]
mdn = ["jmap-mail-types/mdn"]
sieve = ["jmap-mail-types/sieve"]
# Public, feature-gated in-memory reference implementation of MailBackend
# (and optionally MdnBackend/SieveBackend when those features are also enabled).
# Not production — intended as a reference impl, integration-test harness, and
# documentation example. API stability is opt-in via this feature and may
# break across minor versions pre-1.0.
memory = ["dep:uuid", "dep:jmap-metadata-server"]

[dependencies]
jmap-types = { workspace = true }
jmap-mail-types = { workspace = true }
jmap-server = { workspace = true }
# draft-ietf-jmap-metadata-04 capability URI and DataTypeMetadataInfo
# (serde-only); the /set handlers check `using` against the URI.
jmap-metadata-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# mime-tree is the workspace's single gateway to RFC 5322 parsing. Used
# unconditionally by `apply_header_form` in src/email.rs to implement the
# RFC 8621 §4.1.2 As* header-form selectors (asAddresses, asGroupedAddresses,
# asDate, asMessageIds, asURLs). See bd:JMAP-g7wu.5 / bd:JMAP-g7wu.11.
mime-tree = { workspace = true }
# Writes the RFC 5322 message for an Email/set create and maps parsed
# messages to Email body fields (bd:JMAP-u6c5).
jmap-mime = { workspace = true }
# Optional deps activated by the `memory` feature.
uuid = { version = "1", default-features = false, features = ["v4", "std"], optional = true }
# draft-ietf-jmap-metadata-04 helpers the MemoryBackend wires in (JMAP-s4kp.1).
jmap-metadata-server = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# Tests use the public MemoryBackend reference impl from `src/memory/`.
# Self-dep with feature flags ensures the `memory`, `mdn`, and `sieve`
# features are active when compiling integration tests, without exposing
# them to downstream users by default.
# Path-only, no version: cargo drops it on publish, so it never has to
# resolve against crates.io versions that lack these features (JMAP-31o4).
jmap-mail-server = { path = ".", features = ["memory", "mdn", "sieve"] }
