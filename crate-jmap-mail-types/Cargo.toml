[package]
name = "jmap-mail-types"
version = "0.6.2"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RFC 8621 JMAP for Mail data types (Mailbox, Thread, Email, Identity, EmailSubmission, SearchSnippet)"
keywords = ["jmap", "email", "mail", "types", "rfc8621"]
categories = ["email", "encoding"]
exclude = ["AGENTS.md", "CLAUDE.md", "PLAN.md"]

[features]
emailpush = []
mdn = []
sieve = []

[dependencies]
jmap-types = { workspace = true }
jmap-metadata-types = { workspace = true }
jmap-object-history-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
