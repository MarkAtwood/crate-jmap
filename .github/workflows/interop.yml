# Interop tests against Stalwart, a real JMAP server (bd:JMAP-cyub).
#
# The default CI (ci.yml) never starts a container: the jmap-interop
# tests are #[ignore]d. This workflow starts Stalwart with podman (on the
# GitHub Ubuntu runners), runs them, and removes the container. It runs
# only on demand and weekly, never on push, so it never blocks a change.
# See docs/interop/README.md.

name: interop

on:
  workflow_dispatch:
  schedule:
    # Mondays 06:47 UTC.
    - cron: "47 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  stalwart:
    name: jmap-interop (Stalwart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: podman --version
      # Starts Stalwart, runs every interop test binary (--no-fail-fast),
      # writes the full output to target/interop/logs/, names each failing
      # test, and always stops the container.
      - name: interop tests against Stalwart
        run: scripts/interop-test.sh
      - name: keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-log
          path: target/interop/logs/
          if-no-files-found: warn
