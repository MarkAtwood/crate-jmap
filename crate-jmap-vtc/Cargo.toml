[package]
name = "jmap-vtc"
version = "0.6.1"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JMAP VTC (draft-atwood-jmap-vtc-00): umbrella crate re-exporting jmap-vtc-types, -client, and -server"
keywords = ["jmap", "video", "calls", "vtc"]
categories = ["network-programming"]
exclude = ["AGENTS.md", "CLAUDE.md", "PLAN.md"]

[dependencies]
jmap-vtc-types = { workspace = true }
jmap-vtc-client = { workspace = true, optional = true }
jmap-vtc-server = { workspace = true, optional = true }

[features]
client = ["dep:jmap-vtc-client"]
server = ["dep:jmap-vtc-server"]
# The server's in-memory reference backend (not production).
memory = ["server", "jmap-vtc-server/memory"]

[dev-dependencies]
serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
