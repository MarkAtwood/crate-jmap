[package]
name = "jmap-sieve"
version = "0.5.0"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JMAP for Sieve Scripts (RFC 9661): facade re-exporting the sieve feature of jmap-mail-types and jmap-mail-server"
keywords = ["jmap", "sieve", "email", "rfc9661"]
categories = ["network-programming"]
exclude = ["AGENTS.md", "CLAUDE.md", "PLAN.md"]

[dependencies]
jmap-mail-types = { workspace = true, features = ["sieve"] }
jmap-mail-server = { workspace = true, optional = true }

[features]
server = ["dep:jmap-mail-server", "jmap-mail-server/sieve"]

[dev-dependencies]
serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
