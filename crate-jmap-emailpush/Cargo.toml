[package]
name = "jmap-emailpush"
version = "0.6.0"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JMAP Email Delivery Push (draft-ietf-jmap-emailpush-05): facade re-exporting the emailpush feature of jmap-mail-types, -client, and -server"
keywords = ["jmap", "email", "push"]
categories = ["network-programming"]
exclude = ["AGENTS.md", "CLAUDE.md", "PLAN.md"]

[dependencies]
jmap-mail-types = { workspace = true, features = ["emailpush"] }
jmap-mail-client = { workspace = true, optional = true }
jmap-mail-server = { workspace = true, optional = true }

[features]
client = ["dep:jmap-mail-client", "jmap-mail-client/emailpush"]
server = ["dep:jmap-mail-server", "jmap-mail-server/emailpush"]

[dev-dependencies]
serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
